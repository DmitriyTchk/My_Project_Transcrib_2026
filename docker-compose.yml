services:
  # Локальный ASR-сервер faster-whisper (OpenAI-совместимый API на порту 8000)
  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    container_name: vibescribe-whisper
    ports:
      - "8000:8000"
    environment:
      WHISPER__API_KEY: my-secret-token
      WHISPER__MODEL: large-v3
    volumes:
      # Кэш модели: large-v3 (~3 ГБ) скачивается один раз и переживает пересоздание контейнера
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Приложение VibeScribe Studio (React SPA + Express API на порту 3000)
  app:
    build: .
    container_name: vibescribe-app
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - whisper
    environment:
      NODE_ENV: production
      LOCAL_WHISPER_ENDPOINT: http://whisper:8000/v1/audio/transcriptions
      LOCAL_WHISPER_API_KEY: my-secret-token

volumes:
  whisper-models:
